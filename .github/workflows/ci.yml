name: Plugin CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Syntax and behavior checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ["8.0", "8.2", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Parser tests
        run: php tests/test-parser.php
      - name: Safety tests
        run: php tests/test-safety.php
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check assets/js/admin.js
      - name: Shell syntax
        run: bash -n scripts/build-plugin-zip.sh

  package:
    name: Build installable ZIP
    needs: quality
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, mbstring
          coverage: none
      - name: Build ZIP
        run: bash scripts/build-plugin-zip.sh
      - name: Verify ZIP contents
        run: |
          unzip -l dist/senoobar-link-auditor.zip
          unzip -Z1 dist/senoobar-link-auditor.zip | grep -q '^senoobar-link-auditor/senoobar-link-auditor.php$'
          ! unzip -Z1 dist/senoobar-link-auditor.zip | grep -Eq '(^|/)(tests|docs|\.github)/|\.git/'
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: senoobar-link-auditor
          path: dist/senoobar-link-auditor.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release asset
    needs: [quality, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: bash scripts/build-plugin-zip.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/senoobar-link-auditor.zip
